<?xml version="1.0" encoding="UTF-8"?>
<!-- BreakHack GlowIcon art: a sword over a shield in a dungeon doorway.
     The AmiCradle Team's own drawing; GPL 3 or later, like the other Amiga files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0aa"/>
      <stop offset="1" stop-color="#4a505c"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1426"/>
      <stop offset="1" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a5a"/>
      <stop offset="0.6" stop-color="#c02020"/>
      <stop offset="1" stop-color="#701010"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8a96aa"/>
    </linearGradient>
  </defs>
  <!-- doorway -->
  <path d="M14 122 L14 50 A50 46 0 0 1 114 50 L114 122 Z" fill="url(#stone)" stroke="#262a33" stroke-width="3"/>
  <path d="M30 122 L30 56 A34 32 0 0 1 98 56 L98 122 Z" fill="url(#dark)" stroke="#262a33" stroke-width="2"/>
  <path d="M14 70 L30 70 M98 70 L114 70 M14 96 L30 96 M98 96 L114 96 M38 18 L44 30 M90 18 L84 30 M64 6 L64 22" stroke="#30343e" stroke-width="2"/>
  <!-- shield -->
  <path d="M40 56 L88 56 L88 82 Q88 104 64 116 Q40 104 40 82 Z" fill="url(#shield)" stroke="#3a0808" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 60 L64 110 M44 76 L84 76" stroke="#ffd25a" stroke-width="5"/>
  <!-- sword, point up, across the shield -->
  <g transform="rotate(-35 64 70)">
    <path d="M60 8 L64 0 L68 8 L68 84 L60 84 Z" fill="url(#blade)" stroke="#2a3040" stroke-width="2" stroke-linejoin="round"/>
    <rect x="48" y="84" width="32" height="7" rx="2" fill="#ffc63a" stroke="#6a4a00" stroke-width="2"/>
    <rect x="60" y="91" width="8" height="16" fill="#6a3a1a" stroke="#2a1608" stroke-width="2"/>
    <circle cx="64" cy="111" r="5" fill="#ffc63a" stroke="#6a4a00" stroke-width="2"/>
  </g>
</svg>
